name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Build lineup and package
        run: npm run package

      - name: Run tests and verify package
        run: npm test && npm run check:ipk

      - name: Attach IPK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" com.nader.freewavelive_*_all.ipk \
            --title "FreeWave Live TV $TAG" \
            --notes "FreeWave Live TV $TAG. Verify the SHA-256 shown in the release assets. The package requires LG Developer Mode." \
            --verify-tag || \
          gh release upload "$TAG" com.nader.freewavelive_*_all.ipk --clobber
